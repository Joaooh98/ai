# Escopo da análise do SonarCloud.
#
# ATENÇÃO — este arquivo NÃO está em vigor hoje. O projeto usa Análise
# Automática (`sonar.autoscan.enabled=true`, verificado na API), e a Análise
# Automática **ignora** `sonar-project.properties`. Medido: depois de commitar
# este arquivo, `new_duplicated_lines_density` continuou em 64,04% e
# `new_bugs` em 4 — exatamente os mesmos números de antes.
#
# Para a exclusão valer, uma das duas:
#   1. SonarCloud > o projeto > Administration > Analysis Scope >
#      Source File Exclusions  ->  docs/*.html
#   2. Trocar para análise por CI (GitHub Action do Sonar). Aí este arquivo
#      passa a ser lido e nada mais precisa ser feito.
#
# O arquivo fica versionado porque a DECISÃO é esta, e porque ele entra em
# vigor sozinho no dia em que a análise virar CI.
#
# ---------------------------------------------------------------------------
# Por que excluir `docs/*.html`
#
# Eles são SAÍDA, não código. Os quatro diagramas são gerados pelo `archify` a
# partir dos `.json` ao lado, e a regra do repositório é "nunca edite o .html"
# (ver docs/README.md). Medi-los produz dois falsos alarmes:
#
#   - 64% de duplicação em código novo. Cada .html é autocontido de propósito —
#     abre sem servidor e sem rede — então os quatro embutem o mesmo CSS e JS.
#     A duplicação é a decisão de desenho, não um defeito a corrigir.
#   - 4 bugs de acessibilidade (`<title>`, atributo `lang`) dentro do HTML que o
#     renderer emite. Não dá para corrigir aqui: o renderer não vive neste
#     repositório, e editar o .html some na próxima regeração.
#
# Se um dia o renderer for versionado aqui, o certo é corrigir a fonte e apagar
# esta exclusão.
sonar.exclusions=docs/*.html
