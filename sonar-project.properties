# Escopo da análise do SonarCloud.
#
# `docs/*.html` é SAÍDA, não código. Os quatro diagramas são gerados pelo
# `archify` a partir dos `.json` ao lado — a regra do repositório é "nunca edite
# o .html" (ver docs/README.md). Medi-los produz dois falsos alarmes:
#
#   - 64% de duplicação em código novo. Cada .html é autocontido de propósito
#     (abre sem servidor e sem rede), então os quatro embutem o mesmo CSS e JS.
#     A duplicação é real e é a decisão de desenho, não um defeito a corrigir.
#   - 4 bugs de acessibilidade (`<title>`, atributo `lang`) dentro do HTML que o
#     renderer emite. Não dá para corrigir aqui: o renderer não vive neste
#     repositório, e qualquer edição no .html some na próxima regeração.
#
# Excluir saída de build da análise é o tratamento padrão. Se um dia o renderer
# for versionado aqui, o certo é corrigir a fonte e remover esta linha.
sonar.exclusions=docs/*.html
