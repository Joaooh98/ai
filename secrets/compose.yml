# Vault local para as credenciais deste ambiente.
#
#   docker compose -f secrets/compose.yml up -d
#
# Depois: secrets/vault-init (uma vez) e secrets/vault-unseal (a cada boot).
name: ai-secrets

services:
  vault:
    image: hashicorp/vault:1.18
    container_name: ai-vault
    # IPC_LOCK deixa o Vault travar sua memória e não ir para o swap. Sem isso,
    # segredo descriptografado pode acabar escrito em disco pelo kernel — que é
    # exatamente o que o vault existe para evitar.
    cap_add:
      - IPC_LOCK
    # 127.0.0.1 no lado do host NÃO é detalhe: é o que permite rodar sem TLS.
    # Trocar por "8200:8200" publica o vault na rede local em texto puro.
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      # Volume nomeado: é o que faz o segredo sobreviver a restart do container.
      # Sem ele isto viraria modo dev com passos a mais.
      - vault-data:/vault/file
      - ./vault.hcl:/vault/config/vault.hcl:ro
    command: ["server", "-config=/vault/config/vault.hcl"]
    restart: unless-stopped
    healthcheck:
      # 501 = inicializado e lacrado; 503 = selado. Os dois significam "de pé",
      # então o teste é o endpoint responder, não o código ser 200.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vault-data:
    name: ai-secrets-vault-data
